services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: raksha-postgis
    restart: always
    environment:
      POSTGRES_DB: raksha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - raksha_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raksha-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/raksha
    depends_on:
      - postgres

volumes:
  raksha_pgdata:
